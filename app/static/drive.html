<div class="app" id="app">
  <aside class="sidebar">
    <a class="logo" href="/" aria-label="홈">
      <span class="logo_badge logo_text" data-brand-logo data-brand="{organization}">포에버소프트</span>
      <!-- 제품 이름. **로고 자리 바깥**이어야 합니다 — 서버가 `data-brand-logo` 요소의
           내용을 통째로 <img> 로 갈아 끼우므로(app/main.py), 안에 두면 이 글자가
           사라지고 alt 에 마크업이 들어갑니다(2026-10-06 에 겪음). -->
      <span class="logo_name" data-brand="{app_name}">지식LAB</span>
    </a>
    <nav class="nav">
      <a href="#" class="active" id="navAsk"><svg class="i"><use href="#ic-spark"/></svg><span>AI 지식 검색</span></a>
      <a href="#" id="navDrive" aria-expanded="false" aria-controls="navProjects"><svg class="i"><use href="#ic-folder"/></svg><span>프로젝트</span><svg class="i nav_caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg></a>

           자리를 남겨 두면 '없다' 와 '아직 안 불렀다' 를 구분할 수 없어, 자리까지 감춥니다. -->

      <a href="#" id="navMeeting"><svg class="i"><use href="#ic-people"/></svg><span>AI 프로젝트 미팅</span></a>
      <a href="/admin"><svg class="i"><use href="#ic-admin"/></svg><span>관리자 설정</span></a>
    </nav>

    <div class="storage">
      <h3>보관 중인 자료</h3>
      <p><b id="stDocs">0</b>건 · <b id="stSize">0 B</b></p>
      <p class="storage_hint">원본 파일과 정리한 본문을 함께 올리면, 답변에 쓰인 자료를 그 자리에서 내려받을 수 있습니다.</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-right">
        <a class="top_admin" href="/admin"><svg class="i"><use href="#ic-admin"/></svg><span>관리자</span></a>
      </div>
    </header>
    <section class="content" id="content">
      <div class="page-title">
        <h1 id="pageTitle">AI 지식 검색</h1><span class="crumb" id="crumb">전체 자료에서 찾습니다</span>
      </div>

      <!-- ───── AI 프로젝트 미팅 ─────
           자료 검색과 **다른 화면**입니다. 한 패널에 섞으면 지금 무엇을 보고 있는지가
           흐려집니다. 프로젝트를 고른 상태에서만 의미가 있습니다 — 그 프로젝트의 자료를
           근거로 이야기하기 때문입니다. -->
      <section class="mt" id="meetingPane" hidden>
        <form class="mt_ask" id="mtForm">
          <div class="mt_row">
            <span class="ai-badge"><svg class="i"><use href="#ic-people"/></svg><span>회의 주제</span></span>
            <input id="mtTopic" autocomplete="off" aria-label="회의 주제"
                   placeholder="무엇을 함께 생각해볼까요? 예) 사용 이력 통계 화면을 넣는다면 무엇을 먼저 봐야 할까요">
            <button class="send" id="mtSend" type="submit" aria-label="회의 열기"><svg class="i"><use href="#ic-send"/></svg></button>
          </div>
          <div class="mt_opts">
            <span class="mt_opt_label">참가자</span>
            <span class="mt_people" id="mtPeople"></span>
            <span class="mt_opt_label">바퀴</span>
            <select class="mt_rounds" id="mtRounds" aria-label="발언 바퀴 수">
              <option value="1" selected>1바퀴</option>
              <option value="2">2바퀴</option>
              <option value="3">3바퀴</option>
            </select>
            <span class="mt_note" id="mtNote"></span>
          </div>
        </form>

        <div class="mt_board" id="mtBoard" hidden>
          <div class="mt_head">
            <span class="mt_head_t" id="mtHeadTopic"></span>
            <button type="button" class="mt_x" id="mtClose" aria-label="회의 닫기"><svg class="i"><use href="#ic-x"/></svg></button>
          </div>
          <div class="mt_srcs" id="mtSrcs" hidden></div>
          <div class="mt_turns" id="mtTurns"></div>
          <div class="mt_wait" id="mtWait" hidden><span class="dot"></span><span id="mtWaitWho">여는 중…</span></div>
          <div class="mt_sum" id="mtSum" hidden>
            <div class="mt_sum_h"><svg class="i"><use href="#ic-check"/></svg>정리</div>
            <div class="mt_sum_b" id="mtSumBody"></div>
          </div>
        </div>
      </section>

      <!-- AI 질문 — 한 줄로 묻고, 답이 나오면 이 카드 안에서 대화가 된다 -->
      <form class="ai-search" id="aiForm" role="search">
        <div class="ai-row">
          <span class="ai-badge"><svg class="i"><use href="#ic-spark"/></svg><span>AI 지식 검색</span></span>
          <!-- **한 번에 하나씩** 묻는 화면입니다. 이어 묻기(`더 자세히`)는 받지 않습니다 —
               검수된 답변은 미리 써 둔 고정 글이라 "더"에 줄 것이 없고, 직전 질문을 합쳐
               찾으면 멀쩡하던 질문까지 망가집니다(2026-10-07 측정). 그래서 물어볼 말을
               한 문장에 담도록 안내합니다. -->
          <input id="aiQ" autocomplete="off" aria-label="찾을 내용"
                 placeholder="찾는 내용을 한 문장으로 물어보세요. 예) API 등록 절차를 알려줘">
          <button class="send" id="aiSend" type="submit" aria-label="질문 보내기"><svg class="i"><use href="#ic-send"/></svg></button>
          <!-- 자주 하는 질문. 입력칸을 누르면 펼칩니다.

               목록은 **관리자 화면의 '질문 카테고리'** 에서 옵니다(app/api/drive.py 의
               `_questions`). 화면에 박아 두지 않습니다 — 두 곳에 두면 한쪽만 고쳐집니다.

               `AI 지식 검색` 에는 띄우지 않습니다. 거기는 범위가 전체라 모든 프로젝트의
               질문이 섞여, 고르라고 내놓은 것이 고를 수 없는 목록이 됩니다. -->
          <div class="ai-faq" id="aiFaq" hidden role="listbox" aria-label="자주 하는 질문">
            <div class="ai-faq_head">자주 하는 질문</div>
            <div id="aiFaqList"></div>
          </div>
        </div>
        <!-- 세 가지 선택. ①이 꺼지면 ②③은 쓸 수 없다 -->
        <div class="ai-opts">
          <label class="sw" id="aiModeWrap">
            <input type="checkbox" id="aiMode"><span class="sw_track" aria-hidden="true"></span>
            <span class="sw_label">AI 답변</span>
            <span class="blocker" data-blocker hidden></span>
          </label>
          <span class="ai-opt" id="aiDepWrap">
            <span class="ai-opt_one" id="aiModelWrap">
              <label for="aiModel">모델</label>
              <select id="aiModel" aria-label="답변 모델"></select>
              <span class="ai-opt_fixed" id="aiModelName" hidden></span>
            </span>
            <label class="cb" id="aiReasonWrap" hidden><input type="checkbox" id="aiReasoning"><span>추론 과정 보기</span></label>
            <span class="blocker" data-blocker hidden></span>
          </span>
          <span class="ai-note" id="aiNote"></span>
        </div>
      </form>
      <p class="ai-hint" id="aiHint" hidden></p>
      <!-- 검색 결과. **검색창 바깥, 그 아래**에 둔다 — 안에 두면 답이 나올 때마다
           입력칸이 밀려 내려가, 다음 질문을 치려면 눈이 따라가야 한다. 검색창은
           늘 같은 자리에 같은 크기로 있어야 한다. -->
      <section class="ai-result" id="aiAnswer" aria-live="polite" hidden>
        <div class="ans-head">
          <b><svg class="i"><use href="#ic-spark"/></svg><span>AI 지식 검색</span></b>
          <span class="ans-q" id="ansQ"></span>
          <button type="button" class="ans-close" id="ansClose" aria-label="결과 닫기"><svg class="i"><use href="#ic-x"/></svg></button>
        </div>
        <div class="ans-body" id="ansBody"></div>
      </section>


      <!-- 폴더 = 프로젝트. 고르면 그 프로젝트 자료만 보이고, 질문도 그 안에서 찾는다 -->
      <div class="sec-head" data-browse>
        <h2>프로젝트<small id="folderCount"></small></h2>
        <div class="arrows">
          <button type="button" id="prev" aria-label="이전"><svg class="i"><use href="#ic-left"/></svg></button>
          <button type="button" id="next" aria-label="다음"><svg class="i"><use href="#ic-right"/></svg></button>
        </div>
      </div>
      <div class="folders" id="folders" data-browse></div>

      <div class="chips" id="chips" data-browse>
        <div class="filter-wrap" id="filterWrap">
          <button type="button" class="filter-btn" id="filterBtn" aria-expanded="false" aria-controls="filterPanel"><svg class="i"><use href="#ic-filter"/></svg>필터<b class="num" id="filterCount"></b></button>
          <div class="filter-panel" id="filterPanel" role="dialog" aria-label="필터">
            <div class="fp-sec">
              <h4>문서 종류</h4>
              <div class="fp-opts" id="fpTypes"></div>
            </div>
            <div class="fp-sec">
              <h4>프로젝트</h4>
              <div class="fp-opts" id="fpFolders"></div>
            </div>
            <div class="fp-foot">
              <button type="button" class="fp-reset" id="fpReset"><svg class="i"><use href="#ic-reset"/></svg>초기화</button>
              <button type="button" class="fp-apply" id="fpApply">적용하기</button>
            </div>
          </div>
        </div>
        <span id="chipList" class="chip-list"></span>
        <button type="button" class="clear" id="clearAll">모두 지우기</button>
      </div>

      <div class="result-bar" data-browse>
        <span id="resultText"></span>
        <div class="views">
          <span class="lbl">보기:</span>
          <select id="pageSize" aria-label="보기">
            <option value="all">전체 보기</option>
            <option value="10" selected>10개씩 보기</option>
            <option value="20">20개씩 보기</option>
            <option value="50">50개씩 보기</option>
          </select>
          <i class="sep"></i>
          <span class="lbl">정렬:</span>
          <select id="sort" aria-label="정렬"><option value="date">등록일</option><option value="name">이름</option><option value="size">크기</option></select>
        </div>
      </div>

      <div class="list" id="list" data-browse></div>
      <div class="more-wrap" id="moreWrap" data-browse hidden>
        <button type="button" class="more" id="moreBtn"><span id="moreText">더보기</span><svg class="i"><use href="#ic-down"/></svg></button>
      </div>
      <div class="empty" id="empty" data-browse></div>

      <!-- 자료 올리기. 원본과 정리한 본문을 **함께** 집어 놓을 수 있다 -->
      <label class="dropzone" id="dropzone" data-studio-only data-browse>
        <input type="file" id="fileInput" multiple hidden>
        <svg class="cloud" viewBox="0 0 96 64" aria-hidden="true">
          <path d="M26 60C12.7 60 2 50.4 2 38.4c0-10.8 8.6-19.6 19.6-21.2C25.4 7.6 34.8 2 46 2c13.4 0 24.6 8.8 27.6 20.8C85.4 23.6 94 32.4 94 42.4 94 52.2 85.6 60 75.2 60z" fill="currentColor"/>
          <path d="M48 50V27M37.5 36.5 48 26l10.5 10.5" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <strong>여기에 파일을 끌어다 놓으세요</strong>
        <span>또는 <u>내 PC에서 파일 선택</u></span>
        <small>원본(ppt·pdf·xls·hwp)과 같은 이름의 <b>.md</b> 를 함께 올리면 한 건이 됩니다. AI 는 <b>.md</b> 를 읽고, 사람은 원본을 내려받습니다.</small>
      </label>
      <div class="upbar" id="upbar" data-browse hidden>
        <div class="upbar_head"><b id="upTitle">올리는 중…</b><span id="upCount"></span></div>
        <div class="upbar_bar"><span id="upFill"></span></div>
        <ul class="upbar_list" id="upList"></ul>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- 자료 원문. 검수 전 AI 답변은 원문을 함께 보는 것이 전제라 반드시 열려야 한다 -->
<div class="modal" id="docModal" role="dialog" aria-modal="true" aria-labelledby="docTitle">
  <div class="modal_box">
    <div class="modal_head">
      <h3 id="docTitle" data-bind="title"></h3>
      <span class="modal_meta" data-bind="meta"></span>
      <div class="modal_dls" id="docDownloads"></div>
      <button type="button" class="ans-close" id="docClose" aria-label="닫기"><svg class="i"><use href="#ic-x"/></svg></button>
    </div>
    <div class="modal_body" id="docBody"></div>
  </div>
</div>

<!-- 되풀이되는 조각. 대화 부분만 <template> 로 둔다 — 드라이브 목록은 산출물의
     문자열 렌더를 그대로 살려 다음 산출물과 diff 를 뜰 수 있게 했다 -->
<template id="tpl_bot">
  <div class="msg bot">
    <div class="msg_head">
      <span class="badge_verified" hidden><svg class="i"><use href="#ic-check"/></svg>담당자 검수 답변</span>
      <!-- 검수된 답변이 아직 없을 때. **초록 체크를 붙이지 않습니다** — 찾아 준 것은 자료이지
           사람이 확인한 답이 아닙니다. -->
      <span class="badge_docs" hidden><svg class="i"><use href="#ic-folder"/></svg>관련 자료</span>
      <span class="badge_open" hidden><svg class="i"><use href="#ic-send"/></svg>담당자 접수</span>
      <span class="badge_ai" hidden><svg class="i"><use href="#ic-spark"/></svg>AI 정리</span>
    </div>
    <div class="msg_think" hidden>
      <button type="button" class="msg_think_toggle" aria-expanded="true">
        <svg class="i msg_think_chev"><use href="#ic-down"/></svg>
        <span data-bind="think_label">생각하는 중…</span><small data-bind="think_sec"></small>
      </button>
      <div class="msg_think_body" data-bind="think"></div>
    </div>
    <div class="ans-loading msg_wait"><i></i><i></i><i></i><span data-bind="wait"></span></div>
    <div class="msg_md"></div>
    <div class="msg_refs" hidden>
      <!-- AI 가 읽은 것은 본문(.md)뿐입니다. 원본은 아래 따로 둡니다 — 한 칩이 '보기' 와
           '받기' 를 겸하면 근거가 PDF 인 것처럼 보입니다(2026-10-07). -->
      <div class="msg_refs_head"><svg class="i"><use href="#ic-folder"/></svg>참고 자료</div>
      <div class="ans-refs msg_refs_list"></div>
    </div>
    <div class="msg_files" hidden>
      <!-- 내려받는 것. 여러 본문이 같은 원본을 가리키면 **한 번만** 나옵니다. -->
      <div class="msg_refs_head"><svg class="i"><use href="#ic-download"/></svg>원본 문서</div>
      <div class="ans-refs msg_files_list"></div>
    </div>
    <p class="ans-note msg_note" hidden>AI가 정리한 답변입니다. 검수 전이므로 참고 자료 원문을 함께 확인하세요.</p>
    <div class="msg_ask" hidden>
      <span>찾으시는 내용이 없나요?</span>
      <button type="button" class="msg_ask_btn">담당자에게 문의하기</button>
    </div>
    <div class="ticket" hidden>
      <p class="ticket_lead">문의가 담당자에게 접수되었습니다.</p>
      <p class="ticket_no">접수번호 <b data-bind="ticket_id"></b><button type="button" class="ticket_copy">복사</button></p>
      <p class="muted">확인 후 등록된 연락처로 회신드립니다.</p>
    </div>
    <div class="msg_foot" hidden>
      <span class="msg_meta" data-bind="foot"></span>
      <span class="fb" hidden>
        <button type="button" class="fb_btn fb_up" aria-label="도움이 되었어요">👍</button>
        <button type="button" class="fb_btn fb_down" aria-label="아쉬웠어요">👎</button>
      </span>
      <span class="fb_done" hidden>의견 감사합니다</span>
      <button type="button" class="msg_copy" data-bind="copy_label">복사</button>
    </div>
    <div class="fb_why" hidden>
      <div class="fb_why_head"><span>어떤 점이 아쉬웠나요?</span>
        <button type="button" class="fb_why_close" aria-label="닫기"><svg class="i"><use href="#ic-x"/></svg></button></div>
      <button type="button" class="fb_reason" data-reason="mismatch">질문과 다른 답이에요</button>
      <button type="button" class="fb_reason" data-reason="wrong">내용이 틀려요</button>
      <button type="button" class="fb_reason" data-reason="thin">설명이 부족해요</button>
    </div>
  </div>
</template>

<template id="tpl_ref">
  <!-- 본문 하나. **누르면 원문이 열립니다.** 내려받기는 여기 없습니다 — 받는 것은 원본이고
       그쪽은 `tpl_file` 입니다. -->
  <span class="ref">
    <button type="button" class="ref_open" data-doc-open>
      <span class="ref_kind" data-bind="kind"></span><span class="ref_title" data-bind="title"></span>
    </button>
  </span>
</template>

<template id="tpl_file">
  <!-- 원본 하나. 받기만 합니다. -->
  <a class="reffile" data-file-download download>
    <span class="reffile_kind" data-bind="kind"></span>
    <span class="reffile_name" data-bind="name"></span>
    <span class="reffile_size" data-bind="size"></span>
    <svg class="i reffile_ic"><use href="#ic-download"/></svg>
  </a>
</template>

<template id="tpl_suggest">
  <button type="button" class="suggest" data-question><span data-bind="text"></span><small data-bind="topic"></small></button>
</template>

<template id="tpl_up_item">
  <li class="upbar_item"><span class="upbar_name" data-bind="name"></span><span class="upbar_state" data-bind="state"></span></li>
</template>

<script src="/static/dropdown.js"></script>
<script src="/static/drive.js"></script>
</body>
</html>
