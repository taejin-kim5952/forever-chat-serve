<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="100%" role="img"
     aria-labelledby="t d" font-family="'Pretendard','NanumGothic',sans-serif">
  <title id="t">가입부터 API 등록까지의 절차 흐름도</title>
  <desc id="d">회원가입, 로그인, 권한 신청, 관리자 승인, 재로그인, API 등록 순서로 이어지며,
    승인은 관리자가 수동으로 처리하고 승인 뒤에는 반드시 다시 로그인해야 반영됩니다.</desc>

  <!-- 색은 제품 팔레트(quickApiReg.css 의 :root)를 그대로 씁니다.
       도식만 다른 색을 쓰면 화면에 붙였을 때 붙여넣은 티가 납니다. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c93137"/>
    </marker>
  </defs>

  <style>
    .box  { fill:#fff; stroke:#ddd; stroke-width:1.5; rx:10; }
    .user { fill:#f2f2f4; stroke:#ddd; }
    .wait { fill:#fdf6e6; stroke:#e8c98a; }
    .goal { fill:#d6ebec; stroke:#309ba2; }
    .n    { font-size:12px; font-weight:700; fill:#309ba2; }
    .h    { font-size:14px; font-weight:700; fill:#333; }
    .s    { font-size:11.5px; fill:#666; }
    .lane { font-size:11px; font-weight:700; fill:#999; letter-spacing:.08em; }
    .warn { font-size:11.5px; font-weight:700; fill:#c93137; }
    .line { stroke:#999; stroke-width:1.5; fill:none; marker-end:url(#a); }
    .lwarn{ stroke:#c93137; stroke-width:1.5; fill:none; marker-end:url(#aw); stroke-dasharray:5 4; }
  </style>

  <!-- 레인 구분: 누가 하는 일인지가 이 절차의 핵심입니다 -->
  <line x1="470" y1="20" x2="470" y2="540" stroke="#ececee" stroke-width="1.5"/>
  <text class="lane" x="24" y="34">신청자</text>
  <text class="lane" x="492" y="34">관리자</text>

  <!-- ① 회원가입 -->
  <rect class="box user" x="24" y="52" width="410" height="62"/>
  <text class="n" x="44" y="78">①</text>
  <text class="h" x="68" y="78">회원가입</text>
  <text class="s" x="68" y="98">아이디 중복 확인 · 약관 동의 → 회원 상태 MBRSTS1020</text>

  <!-- ② 로그인 -->
  <rect class="box user" x="24" y="146" width="410" height="62"/>
  <text class="n" x="44" y="172">②</text>
  <text class="h" x="68" y="172">로그인</text>
  <text class="s" x="68" y="192">PSSO 인증 · 상황에 따라 SMS 또는 OTP 한 번 더</text>

  <!-- ③ 권한 신청 -->
  <rect class="box user" x="24" y="240" width="410" height="76"/>
  <text class="n" x="44" y="266">③</text>
  <text class="h" x="68" y="266">마이페이지에서 권한 신청</text>
  <text class="s" x="68" y="286">시스템 선택 → 권한그룹 선택 → 신청 사유 입력</text>
  <text class="s" x="68" y="304">신청은 시스템 단위입니다. 여러 개면 각각 신청합니다</text>

  <!-- ④ 승인 대기 (관리자 레인) -->
  <rect class="box wait" x="492" y="240" width="204" height="76"/>
  <text class="n" x="512" y="266" fill="#8a5e13">④</text>
  <text class="h" x="536" y="266">승인 심사</text>
  <text class="s" x="512" y="286">사람이 직접 처리합니다.</text>
  <text class="s" x="512" y="304">자동 승인이 아닙니다</text>

  <!-- ⑤ 재로그인 -->
  <rect class="box user" x="24" y="348" width="410" height="76"/>
  <text class="n" x="44" y="374">⑤</text>
  <text class="h" x="68" y="374">로그아웃 후 다시 로그인</text>
  <text class="warn" x="68" y="394">★ 이 단계를 건너뛰면 승인이 나도 화면이 그대로입니다</text>
  <text class="s" x="68" y="412">권한 정보가 로그인 시점 기준으로 세션에 담기기 때문입니다</text>

  <!-- ⑥ 사용 -->
  <rect class="box goal" x="24" y="456" width="410" height="76"/>
  <text class="n" x="44" y="482">⑥</text>
  <text class="h" x="68" y="482">API 등록·배포 메뉴 사용</text>
  <text class="s" x="68" y="502">시스템 목록에 신청한 시스템이 나타납니다</text>
  <text class="s" x="68" y="520">옵저버 권한이면 조회만 되고 등록 버튼은 보이지 않습니다</text>

  <!-- 흐름선 -->
  <path class="line" d="M229,114 L229,142"/>
  <path class="line" d="M229,208 L229,236"/>
  <path class="line" d="M434,278 L488,278"/>
  <path class="line" d="M594,316 L594,384 L438,384"/>
  <path class="line" d="M229,424 L229,452"/>

  <!-- 반려 -->
  <path class="lwarn" d="M540,316 L540,340 L120,340 L120,320"/>
  <text class="warn" x="150" y="336">반려되면 사유를 확인하고 ③부터 다시</text>

  <text class="s" x="446" y="272" fill="#999">신청</text>
  <text class="s" x="446" y="378" fill="#999">승인</text>
</svg>
