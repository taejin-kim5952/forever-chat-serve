# 운영(폐쇄망) 배포용 compose. 개발 서버에서 운영 절차를 리허설할 때도 이 파일을 쓴다.
#
# 폐쇄망에서는 이미지를 빌드하지 않고(인터넷 불가) 다음 순서로 준비한다.
#   1) docker load -i app.tar            (앱 이미지)
#   2) docker load -i ollama-base.tar    (모델 없는 공식 Ollama 이미지)
#   3) ./scripts/load_models.sh artifacts/model-*.tar.gz   (모델을 볼륨에 반입)
#   4) docker compose -f docker-compose.prod.yml up -d
#
# 모델을 이미지에 굽지 않는 이유: 답변 4B + 채점 8B + 임베딩 = 13GB 라 빌드 머신
# 디스크와 아티팩트 크기를 넘긴다. 모델별 tar 로 나누면 하나씩 반입·교체할 수 있다.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: openapi-chat-ollama
    volumes:
      # 모델은 이 볼륨에 들어 있다(load_models.sh 로 미리 채운다).
      - ollama_data:/root/.ollama
    environment:
      # 메모리가 넉넉하지 않은 서버에서 가장 중요한 설정.
      #
      # 2인 이유: 질문 1건은 '임베딩 모델(검색) → 답변 모델(생성)' 순으로 둘 다 쓴다.
      # 1로 두면 매 질문마다 서로를 밀어내며 수 GB를 디스크에서 다시 읽어 훨씬 느려진다.
      # 2면 bge-m3(~1GB) + 답변 모델(~4GB)이 함께 상주한다.
      # 채점 모델까지 세 개를 동시에 쓰려면 3으로 올리되 메모리를 먼저 확인할 것
      # (평가는 가끔 돌리므로 2로 두고 그때만 교체되게 하는 편이 안전하다).
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-2}"
      # 동시 처리 수. 늘리면 요청마다 컨텍스트가 따로 잡혀 메모리가 배로 든다.
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      # 마지막 사용 후 모델을 메모리에 두는 시간. 짧으면 메모리는 빨리 반납하지만
      # 다음 질문에서 다시 로딩(수십 초)한다. 디스크 여유가 있으면 길게 두는 편이 빠르다.
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  app:
    image: openapi-chat/app:${APP_TAG:-1.1}
    container_name: openapi-chat-app
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      # 답변 모델과 채점/질문생성 모델을 다르게 두는 것을 권한다 —
      # 같은 모델이 답하고 채점하면 자기 답변에 후한 점수를 준다.
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen3.5:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      # 추론(thinking) 모델은 사고 과정만 내보내고 content 를 비워 답변이 사라진다.
      OLLAMA_THINK: "false"
      # Ollama 기본 num_ctx(4096)로는 참고 문서가 잘려 답변이 중간에 끊긴다.
      OLLAMA_NUM_CTX: "8192"
      OLLAMA_NUM_PREDICT: "1024"
      # 데이터는 전부 볼륨(app_data) 안에 둔다. 경로를 명시해 두면 운영 중 위치 파악이 쉽다.
      CHROMA_PERSIST_DIR: /app/data/chroma
      SEMANTIC_CACHE_FILE: /app/data/semantic_cache.json
      CATEGORIES_FILE: /app/data/categories.json
      QUESTION_LOG_FILE: /app/data/question_log.jsonl
      QUESTION_EMBEDDING_FILE: /app/data/question_embeddings.jsonl
      ANALYTICS_FILE: /app/data/analytics.json
      FALLBACK_QUEUE_FILE: /app/data/fallback_queue.jsonl
      GOLDEN_SET_FILE: /app/data/golden_set.jsonl
      LOG_FILE: /app/data/logs/app.jsonl
      # true 로 두면 이미지의 시드가 볼륨의 문서·카테고리를 덮어쓴다(초기화).
      # 평소에는 false — 관리자 화면에서 편집한 내용이 배포마다 되돌아가면 안 된다.
      SEED_FORCE: "${SEED_FORCE:-false}"
    volumes:
      # 질문 로그·분석 결과·편집한 문서·색인이 모두 여기 남는다. 백업 대상.
      - app_data:/app/data
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  ollama_data:
  app_data:
