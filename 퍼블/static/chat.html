<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>API Manager 도우미</title>
<link rel="stylesheet" href="/static/chat.css">
<!-- [DEV ONLY] 로컬 미리보기용 폴백 3줄 — 개발 이식 시 data-dev-only 가 붙은 태그를 모두 삭제 -->
<script data-dev-only>document.write('<link rel="stylesheet" href="chat.css">');</script>
</head>
<body>

<!-- ============================================================
     [DEV ONLY] 확인용 상태 목업 바 — 개발 이식 시 이 블록 전체 삭제
     ============================================================ -->
<div class="chat_devbar" data-dev-only>
  <span class="chat_devbar_label">상태 목업</span>
  <div class="chat_devbar_group">
    <button type="button" data-dev="answer">answer</button>
    <button type="button" data-dev="related">related_docs</button>
    <button type="button" data-dev="unresolved">unresolved</button>
    <button type="button" data-dev="loading">로딩</button>
    <button type="button" data-dev="error">오류</button>
  </div>
  <div class="chat_devbar_group">
    <button type="button" data-dev="cat-none">주제 미선택</button>
    <button type="button" data-dev="cat-set">주제 선택</button>
    <button type="button" data-dev="pop-open">팝오버 열기</button>
    <button type="button" data-dev="pop-empty">검색 결과 없음</button>
    <button type="button" data-dev="q-open">추천질문 펼침</button>
    <button type="button" data-dev="waiting">대기중(disabled)</button>
  </div>
  <div class="chat_devbar_group">
    <button type="button" data-dev="newchat-on">새 대화 활성</button>
    <button type="button" data-dev="newchat-off">새 대화 비활성</button>
    <button type="button" data-dev="ticket-chat">접수번호 포함 대화</button>
    <button type="button" data-dev="copy-done">복사됨 표시</button>
    <button type="button" data-dev="bottom-show">맨아래로 노출</button>
    <button type="button" data-dev="bottom-new">맨아래로 새답변</button>
    <button type="button" data-dev="bottom-hide">맨아래로 숨김</button>
  </div>
  <div class="chat_devbar_group">
    <button type="button" data-dev="intro-cats-open">인트로 펼침</button>
    <button type="button" data-dev="intro-cats-close">인트로 닫힘</button>
    <button type="button" data-dev="cat-empty">주제 0건</button>
    <button type="button" data-dev="intro-pick">인트로에서 주제 고름</button>
  </div>
  <div class="chat_devbar_group">
    <button type="button" data-dev="fb-base">피드백 기본</button>
    <button type="button" data-dev="fb-up">👍 누름</button>
    <button type="button" data-dev="fb-down">👎 누름(이유)</button>
    <button type="button" data-dev="fb-reason">이유 고른 뒤</button>
    <button type="button" data-dev="fb-fail">저장 실패</button>
  </div>
  <div class="chat_devbar_group">
    <button type="button" data-dev="reset">초기화</button>
  </div>
</div>
<!-- ==================== [DEV ONLY] end ==================== -->

<div class="chat_wrap">
<div class="chat_block" id="chatBlock">

  <header class="chat_header">
    <div class="chat_header_brand">
      <span class="chat_logo">KT</span>
      <span class="chat_title">API Manager 도우미</span>
    </div>
    <p class="chat_header_desc">API 등록 · 그룹 · 템플릿</p>
    <button type="button" class="qr_pill qr_pill_outline chat_reset" id="chatReset" disabled>
      <span class="chat_reset_ico" aria-hidden="true">↻</span> 새 대화
    </button>
  </header>

  <div class="chat_list" id="chatList">
    <div class="chat_list_inner" id="chatListInner">

      <section class="chat_intro" id="chatIntro">
        <h2 class="chat_intro_title">무엇이 궁금하신가요?</h2>
        <p class="chat_intro_desc">주제를 먼저 고르시면 더 정확하게 찾아드립니다.</p>

        <h3 class="chat_intro_sub">자주 찾는 주제</h3>
        <div class="chat_cat_quick" id="chatCatQuick"></div>
        <button type="button" class="chat_cat_more" id="chatCatMore"
                aria-expanded="false" aria-controls="chatIntroCats">전체 주제 보기 <span class="chat_caret">▾</span></button>

        <!-- 인트로에서는 그 자리에서 펼칩니다 — 아래 팝오버와 같은 마크업입니다 -->
        <div class="chat_intro_cats" id="chatIntroCats">
          <div class="chat_cat_search_row">
            <span class="chat_cat_search_ico" aria-hidden="true">🔍</span>
            <input type="text" class="chat_cat_search" id="chatIntroCatSearch" placeholder="주제 검색" autocomplete="off" aria-label="주제 검색">
          </div>
          <div class="chat_cat_list" id="chatIntroCatList" role="listbox" aria-label="주제 목록"></div>
          <p class="chat_cat_empty">일치하는 주제가 없습니다.<br>그냥 질문을 입력해 주세요.</p>
        </div>
      </section>

    </div>
  </div>

  <div class="chat_compose" id="chatCompose">

    <button type="button" class="chat_to_bottom" id="chatToBottom" aria-label="맨 아래로">
      <span aria-hidden="true">↓</span>
    </button>

    <div class="chat_compose_top">
      <div class="chat_cat_trigger_wrap">
        <button type="button" class="chat_cat_trigger" id="chatCatTrigger"
                aria-expanded="false" aria-controls="chatCatPopover" aria-haspopup="dialog">
          <span class="chat_cat_hash">＃</span>
          <span class="chat_cat_trigger_label">주제 선택</span>
          <span class="chat_caret">▾</span>
        </button>
        <span class="chat_cat_clear" role="button" tabindex="0" data-category-clear
              aria-label="주제 선택 해제" title="주제 선택 해제">✕</span>
      </div>

      <button type="button" class="chat_q_btn" id="chatCatQBtn" aria-expanded="false" aria-controls="chatCatQuestions" hidden>
        추천 질문 <span class="chat_q_btn_count">0</span> <span class="chat_caret">▾</span>
      </button>
    </div>

    <!-- 주제 선택 팝오버 -->
    <div class="chat_cat_popover" id="chatCatPopover" role="dialog" aria-label="주제 선택" aria-modal="false" data-selected-category="">
      <div class="chat_cat_pop_head">
        <span class="chat_cat_pop_title">주제 선택</span>
        <button type="button" class="chat_cat_pop_close" aria-label="닫기">✕</button>
      </div>
      <div class="chat_cat_search_row">
        <span class="chat_cat_search_ico" aria-hidden="true">🔍</span>
        <input type="text" class="chat_cat_search" id="chatCatSearch" placeholder="주제 검색" autocomplete="off" aria-label="주제 검색">
      </div>
      <div class="chat_cat_list" id="chatCatList" role="listbox" aria-label="주제 목록"></div>
      <p class="chat_cat_empty">일치하는 주제가 없습니다.<br>그냥 질문을 입력해 주세요.</p>
    </div>

    <!-- 추천 질문 -->
    <div class="chat_q_list" id="chatCatQuestions" role="listbox" aria-label="추천 질문"></div>

    <div class="chat_input_row">
      <input type="text" class="chat_input" id="chatInput" placeholder="질문을 입력하세요" autocomplete="off">
      <button type="button" class="qr_pill qr_pill_accent chat_send" id="chatSend">전송</button>
    </div>
    <p class="chat_disclaimer">AI가 만든 답변을 담당자가 검수한 내용입니다.</p>
  </div>

</div>
</div>

<!-- 출처 문서 상세 모달 -->
<div class="qr_modal_backdrop chat_doc_backdrop" id="chatDocModal">
  <div class="qr_modal chat_doc_modal" role="dialog" aria-modal="true" aria-labelledby="chatDocTitle">
    <div class="chat_doc_head">
      <div>
        <h3 class="chat_doc_title" id="chatDocTitle" data-bind="doc_title">문서 제목</h3>
        <p class="chat_doc_section" data-bind="doc_section">섹션명</p>
      </div>
      <button type="button" class="chat_doc_close" aria-label="닫기">✕</button>
    </div>
    <div class="chat_doc_body" data-bind="doc_excerpt" tabindex="0"></div>
    <div class="chat_doc_foot">
      <a class="qr_pill qr_pill_outline chat_doc_link" href="#" data-bind="doc_ref">문서로 이동</a>
    </div>
  </div>
</div>

<!-- 새 대화 확인 모달 — 접수번호가 포함된 대화일 때만 -->
<div class="qr_modal_backdrop" id="chatResetModal">
  <div class="qr_modal chat_reset_modal" role="dialog" aria-modal="true" aria-labelledby="chatResetTitle">
    <div class="chat_doc_head">
      <h3 class="chat_doc_title" id="chatResetTitle">새 대화를 시작할까요?</h3>
      <button type="button" class="chat_doc_close" data-reset-cancel aria-label="닫기">✕</button>
    </div>
    <div class="chat_reset_body">
      접수번호가 포함된 대화입니다. 지우면 번호를 다시 볼 수 없습니다.
    </div>
    <div class="chat_reset_foot">
      <button type="button" class="qr_pill qr_pill_outline" data-reset-cancel>취소</button>
      <button type="button" class="qr_pill qr_pill_accent" id="chatResetOk">새 대화 시작</button>
    </div>
  </div>
</div>

<p class="chat_sr_live" id="chatLive" role="status" aria-live="polite"></p>

<!-- ===================== 템플릿 ===================== -->

<template id="tpl_user">
  <div class="chat_msg chat_msg_user">
    <span class="chat_msg_cat" data-bind="category_label"></span>
    <div class="chat_bubble chat_bubble_user" data-bind="question"></div>
  </div>
</template>

<template id="tpl_answer">
  <div class="chat_msg chat_msg_bot">
    <div class="chat_bubble chat_bubble_bot">
      <div class="chat_md" data-bind="answer"></div>
      <div class="chat_src">
        <p class="chat_src_label">출처</p>
        <div class="chat_src_items" data-bind="source_docs"></div>
      </div>
      <p class="chat_meta">
        <span class="chat_verified"><span class="chat_verified_ico" aria-hidden="true">✓</span> 담당자 검수 완료</span>
        <span class="chat_meta_dot" aria-hidden="true">·</span>
        <span class="chat_meta_ai">AI가 작성한 답변입니다</span>
        <button type="button" class="chat_msg_copy" data-copy aria-label="답변 복사">복사</button>
        <span class="chat_fb">
          <button type="button" class="chat_fb_btn chat_fb_up" data-fb="up" aria-pressed="false" aria-label="도움이 됐어요">👍</button>
          <button type="button" class="chat_fb_btn chat_fb_down" data-fb="down" aria-pressed="false" aria-label="도움이 안 됐어요">👎</button>
        </span>
      </p>

      <!-- 👎 이유 — 모달이 아니라 말풍선 안에 인라인으로 펼칩니다 -->
      <div class="chat_fb_reasons">
        <p class="chat_fb_reasons_head">
          <span>어떤 점이 아쉬웠나요?</span>
          <button type="button" class="chat_fb_skip">건너뛰기</button>
        </p>
        <div class="chat_fb_reason_list">
          <button type="button" class="chat_fb_reason" data-reason="mismatch">질문과 다른 답이에요</button>
          <button type="button" class="chat_fb_reason" data-reason="wrong">내용이 틀려요</button>
          <button type="button" class="chat_fb_reason" data-reason="thin">설명이 부족해요</button>
        </div>
      </div>
      <p class="chat_fb_done">의견 감사합니다</p>
    </div>
  </div>
</template>

<template id="tpl_related">
  <div class="chat_msg chat_msg_bot">
    <div class="chat_bubble chat_bubble_bot chat_bubble_related">
      <p class="chat_rel_head">
        <span class="chat_rel_ico" aria-hidden="true">ⓘ</span>
        <span>이 질문에 딱 맞는 답변이 아직 준비되지 않았습니다.<br>대신 관련 있어 보이는 문서를 찾았습니다.</span>
      </p>
      <div class="chat_rel_list" data-bind="related_docs"></div>
      <p class="chat_rel_foot">
        <span class="chat_rel_foot_txt">찾으시는 내용이 없나요?</span>
        <button type="button" class="qr_pill qr_pill_teal chat_rel_ask" data-ask-support>담당자에게 문의하기</button>
      </p>
    </div>
  </div>
</template>

<template id="tpl_related_item">
  <div class="chat_rel_card">
    <p class="chat_rel_title"><span class="chat_doc_ico" aria-hidden="true">📄</span> <span class="chat_rel_title_txt"></span></p>
    <p class="chat_rel_section"></p>
    <p class="chat_rel_excerpt"></p>
    <button type="button" class="chat_rel_open" data-doc-open>문서 열기 <span aria-hidden="true">›</span></button>
  </div>
</template>

<template id="tpl_src">
  <button type="button" class="chat_src_item" data-doc-open>
    <span class="chat_doc_ico" aria-hidden="true">📄</span>
    <span class="chat_src_title"></span>
  </button>
</template>

<template id="tpl_unresolved">
  <div class="chat_msg chat_msg_bot">
    <div class="chat_bubble chat_bubble_bot chat_bubble_unresolved">
      <p class="chat_unres_msg">
        <span class="chat_unres_ico" aria-hidden="true">ⓘ</span>
        <span data-bind="message"></span>
      </p>
      <p class="chat_ticket">
        접수번호
        <span class="chat_ticket_id" data-bind="ticket_id"></span>
        <button type="button" class="chat_ticket_copy" aria-label="접수번호 복사">복사</button>
      </p>
      <p class="chat_unres_note">확인 후 등록된 이메일로 회신드립니다.</p>
    </div>
  </div>
</template>

<template id="tpl_loading">
  <div class="chat_msg chat_msg_bot chat_msg_loading">
    <div class="chat_bubble chat_bubble_bot chat_bubble_loading">
      <span class="chat_dots" aria-label="답변을 찾고 있습니다"><i></i><i></i><i></i></span>
    </div>
  </div>
</template>

<template id="tpl_error">
  <div class="chat_msg chat_msg_bot">
    <div class="chat_bubble chat_bubble_bot chat_bubble_error">
      <p class="chat_err_msg"><span class="chat_err_ico" aria-hidden="true">!</span> 일시적인 오류로 답변을 가져오지 못했습니다.</p>
      <button type="button" class="qr_pill qr_pill_outline chat_retry" data-retry data-question="">다시 시도</button>
    </div>
  </div>
</template>

<script src="/static/vendor/jquery-3.7.1.min.js"></script>
<script data-dev-only>window.jQuery||document.write('<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>');</script>
<script src="/static/chat.js"></script>
<script data-dev-only>window.__chatLoaded||document.write('<script src="chat.js"><\/script>');</script>
</body>
</html>
